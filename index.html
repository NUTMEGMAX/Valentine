<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Important Question 👀💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: 'Comic Sans MS', 'Arial Rounded MT Bold', cursive;
      background: radial-gradient(circle, #ffe0ec, #ffd6a5);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      overflow: hidden;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 25px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.2);
      max-width: 360px;
      width: 90%;
      animation: pop 0.8s ease;
      position: relative;
    }

    @keyframes pop {
      from { transform: scale(0.7); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    img {
      width: 190px;
      margin-bottom: 10px;
    }

    h1 {
      color: #ff4d6d;
      font-size: 24px;
    }

    p {
      font-size: 16px;
      margin: 10px 0;
    }

    .buttons {
      margin-top: 20px;
      position: relative;
      height: 80px;
    }

    button {
      padding: 12px 22px;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      cursor: pointer;
      position: absolute;
      transition: all 0.3s ease;
    }

    .yes {
      background: #ff4d6d;
      color: white;
      left: 30px;
    }

    .yes:hover {
      transform: scale(1.15);
    }

    .no {
      background: #bdbdbd;
      right: 30px;
    }

    .message {
      margin-top: 25px;
      font-size: 18px;
      min-height: 50px;
    }

    .share {
      display: none;
      margin-top: 20px;
      background: #25D366;
      color: white;
      padding: 12px 18px;
      border-radius: 30px;
      font-size: 15px;
      text-decoration: none;
      display: inline-block;
    }

    .confetti, .heart {
      position: fixed;
      top: -10px;
      animation: fall linear infinite;
      z-index: 999;
    }

    .confetti {
      width: 10px;
      height: 10px;
    }

    .heart {
      font-size: 20px;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div class="card">
    <img src="minion-rose.png" alt="Minion holding a peach rose">

    <h1>Will you be my Valentine? 💘</h1>
    <p>Please answer carefully… screenshots will be taken 😌</p>

    <div class="buttons">
      <button class="yes" onclick="yesClicked()">YES 💖</button>
      <button class="no" id="noBtn">NO 😒</button>
    </div>

    <div class="message" id="message"></div>

    <a id="shareBtn" class="share" target="_blank">📲 Share on WhatsApp</a>
  </div>

  <audio id="music" loop>
    <source src="love-music.mp3" type="audio/mpeg">
  </audio>

  <script>
    const noBtn = document.getElementById("noBtn");
    const shareBtn = document.getElementById("shareBtn");

    // NO button runs away
    noBtn.addEventListener("mouseenter", () => {
      const x = Math.random() * 200 - 100;
      const y = Math.random() * 150 - 75;
      noBtn.style.transform = `translate(${x}px, ${y}px)`;
    });

    function yesClicked() {
      const message =
        "AYYYYY 😍🎉 I SAID YES!! 💖💐\n\n" +
        "Guess who just secured the Valentine bag 😌🔥";

      document.getElementById("message").innerHTML =
        "CONFIRMED 😍💘<br>You are officially my Valentine 💐🥹";

      document.getElementById("music").play();
      launchConfetti();
      launchHearts();

      shareBtn.style.display = "inline-block";
      shareBtn.href = "https://wa.me/?text=" + encodeURIComponent(message);
    }

    function noClicked() {
      const message =
        "I tried to say NO 😭💔 but the button kept running away 🏃‍♀️😂";

      document.getElementById("message").innerHTML =
        "This hurts 😭💔<br>Minion is in tears…";

      shareBtn.style.display = "inline-block";
      shareBtn.href = "https://wa.me/?text=" + encodeURIComponent(message);
    }

    function launchConfetti() {
      for (let i = 0; i < 120; i++) {
        const confetti = document.createElement("div");
        confetti.className = "confetti";
        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.backgroundColor =
          `hsl(${Math.random() * 360}, 100%, 70%)`;
        confetti.style.animationDuration =
          Math.random() * 3 + 2 + "s";
        document.body.appendChild(confetti);
        setTimeout(() => confetti.remove(), 5000);
      }
    }

    function launchHearts() {
      for (let i = 0; i < 40; i++) {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "💖";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration =
          Math.random() * 3 + 3 + "s";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 6000);
      }
    }
  </script>

</body>
</html>
