<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Will You Be My Valentine? 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: 'Comic Sans MS', 'Arial Rounded MT Bold', sans-serif;
      background: linear-gradient(135deg, #ffdee9, #b5fffc);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      overflow: hidden;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      max-width: 350px;
      width: 90%;
      animation: popIn 1s ease;
    }

    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    img {
      width: 180px;
      margin-bottom: 15px;
    }

    h1 {
      color: #ff4d6d;
      margin-bottom: 20px;
    }

    .buttons {
      display: flex;
      justify-content: space-around;
      margin-top: 20px;
    }

    button {
      padding: 12px 25px;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s, background 0.3s;
    }

    .yes {
      background: #ff4d6d;
      color: white;
    }

    .yes:hover {
      background: #ff1f4a;
      transform: scale(1.1);
    }

    .no {
      background: #ccc;
    }

    .no:hover {
      background: #aaa;
      transform: scale(1.05);
    }

    .message {
      margin-top: 20px;
      font-size: 18px;
      min-height: 40px;
    }

    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      background: red;
      top: -10px;
      animation: fall linear infinite;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div class="card">
    <!-- Replace the src with your Minion image -->
    <img src="minion-rose.png" alt="Minion holding a peach rose">

    <h1>Will you be my Valentine? 💘</h1>

    <div class="buttons">
      <button class="yes" onclick="yesClicked()">Yes 💖</button>
      <button class="no" onclick="noClicked()">No 😢</button>
    </div>

    <div class="message" id="message"></div>
  </div>

 <script>
  const noBtn = document.getElementById("noBtn");
  const shareBtn = document.getElementById("shareBtn");

  let noAttempts = 0;

  noBtn.addEventListener("mouseenter", () => {
    noAttempts++;

    // Move away
    const x = Math.random() * 200 - 100;
    const y = Math.random() * 150 - 75;
    noBtn.style.transform = `translate(${x}px, ${y}px)`;

    // Shrink on 2nd attempt
    if (noAttempts === 2) {
      noBtn.style.transform += " scale(0.7)";
    }

    // Disappear on 3rd attempt
    if (noAttempts >= 3) {
      noBtn.style.opacity = "0";
      noBtn.style.pointerEvents = "none";

      document.getElementById("message").innerHTML =
        "🚫 NO option has been removed for your safety 😌💘";
    }
  });

  function yesClicked() {
    const message =
      "AYYYYY 😍🎉 I SAID YES!! 💖💐\n\n" +
      "Officially someone’s Valentine now 😌🔥";

    document.getElementById("message").innerHTML =
      "CONFIRMED 😍💘<br>You are officially my Valentine 💐🥹";

    document.getElementById("music").play();
    launchConfetti();
    launchHearts();

    shareBtn.style.display = "inline-block";
    shareBtn.href = "https://wa.me/?text=" + encodeURIComponent(message);
  }

  function launchConfetti() {
    for (let i = 0; i < 120; i++) {
      const confetti = document.createElement("div");
      confetti.className = "confetti";
      confetti.style.left = Math.random() * 100 + "vw";
      confetti.style.backgroundColor =
        `hsl(${Math.random() * 360}, 100%, 70%)`;
      confetti.style.animationDuration =
        Math.random() * 3 + 2 + "s";
      document.body.appendChild(confetti);
      setTimeout(() => confetti.remove(), 5000);
    }
  }

  function launchHearts() {
    for (let i = 0; i < 40; i++) {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "💖";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration =
        Math.random() * 3 + 3 + "s";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 6000);
    }
  }
</script>

</body>
</html>
